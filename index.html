    const runTarget = rd.total;
    const pct5k = runTarget > 0 ? Math.min((runDone / runTarget) * 100, 100) : 0;
    const noteHtml = rd.note ? `<div class="week-summary-note">${rd.note}</div>` : '';
    const warnHtml = rd.noteWarning ? `<div class="week-summary-warning">⚠ ${rd.noteWarning}</div>` : '';

    document.getElementById('week-summary').innerHTML = `
      <div class="week-summary-title">Semana ${week} — ${wd.block}</div>
      <div class="week-summary-row">
        <div class="week-summary-goal">
          <div class="week-summary-goal-label">1000LB CLUB</div>
          <div><span class="week-summary-goal-value">${total}</span><span class="week-summary-goal-target">/${TARGET}kg</span></div>
          <div class="week-summary-goal-pct cyan">${((total/TARGET)*100).toFixed(1)}%</div>
          <div class="week-summary-track"><div class="week-summary-fill" style="width:${pct1k}%"></div></div>
        </div>
        <div class="week-summary-center">
          <div class="week-summary-theme">${wd.theme}</div>
          ${noteHtml}
          ${warnHtml}
        </div>
        <div class="week-summary-goal">
          <div class="week-summary-goal-label">CORRIDA</div>
          <div><span class="week-summary-goal-value">${runDone}</span><span class="week-summary-goal-target">/${runTarget}min</span></div>
          <div class="week-summary-goal-pct green">${Math.round(pct5k)}%</div>
          <div class="week-summary-track"><div class="week-summary-fill green" style="width:${pct5k}%"></div></div>
        </div>
      </div>
      <div class="week-summary-lifts">
        <span><strong>${config.oneRM.squat}</strong> SQT</span>
        <span><strong>${config.oneRM.bench}</strong> BNC</span>
        <span><strong>${config.oneRM.deadlift}</strong> DL</span>
      </div>`;

    // Session cards
    const picker = document.getElementById('session-picker');
    picker.innerHTML = DAY_DEFS.map(dd => {
      const done = Storage.isDayCompleted(dd.day);
      const skipAcc = dd.type === 'accessories' && week >= 21;
      if (skipAcc) return `
        <div class="session-card type-${dd.type} completed" style="opacity:0.4">
          <div class="session-card-header">
            <span class="session-card-title">D${dd.day} ${dd.name}</span>
            <span class="session-card-badge">SKIP</span>
          </div>
          <div class="session-card-scheme">Semana de taper — sem acessorios</div>
        </div>`;

      let scheme = '';
      if (dd.type === 'strength' && wd.p && !wd.special) {
        const ex = dd.exercises[0];
        const s = ex.level === 'primary' ? wd.p : wd.sec;
        const w = Workout.calcWeight(config.oneRM[ex.lift], s.pct);
        scheme = `${s.s}x${s.r} @ ${s.pct}% = <strong class="cyan">${w}kg</strong>`;
      } else if (dd.type === 'combined' && wd.p && !wd.special) {
        const s = dd.strength.level === 'primary' ? wd.p : wd.sec;
        const w = Workout.calcWeight(config.oneRM[dd.strength.lift], s.pct);
        const runInfo = rd[dd.run];
        const zi = ZONE_INFO[runInfo.zone];
        scheme = `${s.s}x${s.r} @ ${s.pct}% = <strong class="purple">${w}kg</strong> + <strong class="green">${runInfo.min}min ${runInfo.zone}</strong>${zi ? ` <span style="font-size:10px;color:var(--text-muted)">${zi.fc}</span>` : ''}`;
      } else if (dd.type === 'running') {
        const runInfo = rd[dd.run];
        const zi = ZONE_INFO[runInfo.zone];
        scheme = `<strong class="green">${runInfo.min}min ${runInfo.zone}</strong>${zi ? ` <span style="font-size:10px;color:var(--text-muted)">${zi.fc}</span>` : ''}`;
      } else if (dd.type === 'accessories') {
        scheme = `<strong class="amber">7 exercicios</strong>`;
      } else if (wd.special === '1rm_test') {
        scheme = `<strong class="cyan">1RM TEST</strong>`;
      } else if (wd.special === 'recovery') {
        scheme = `<strong class="cyan">Recovery</strong>`;
      }

      return `
        <div class="session-card type-${dd.type} ${done ? 'completed' : ''}" data-day="${dd.day}">
          <div class="session-card-header">
            <span class="session-card-title">
              D${dd.day} ${dd.name}${done ? '<span class="session-card-check">✓</span>' : ''}
            </span>
            <span class="session-card-badge">${dd.sugDay}</span>
          </div>
          <div class="session-card-scheme">${scheme}</div>
        </div>`;
    }).join('');

    picker.querySelectorAll('.session-card:not(.completed)').forEach(card => {
      card.addEventListener('click', () => this.startWorkout(parseInt(card.dataset.day)));
    });

    document.getElementById('current-week').textContent = week;

    const ss = this.syncStatusInfo();
    const sse = document.getElementById('sync-status');
    if (sse) sse.innerHTML = `<span class="sync-dot ${ss.cls}"></span> Sync: ${ss.text}`;
  },

  // Classifica o status de sync pra UI (cor). Nunca falha mudo: sempre mostra o estado.
  syncStatusInfo() {
    const s = Sync.getStatus();
    let cls = 'muted';
    if (/sincronizado|atualizado/.test(s)) cls = 'ok';
    else if (/pendente|offline|erro/.test(s)) cls = 'warn';
    return { text: s, cls };
  },

  // Re-renderiza os indicadores de sync (home + settings) quando o push/pull async conclui.
  refreshSyncIndicator() {
    const ss = this.syncStatusInfo();
    const a = document.getElementById('sync-status');
    if (a) a.innerHTML = `<span class="sync-dot ${ss.cls}"></span> Sync: ${ss.text}`;
    const b = document.getElementById('sync-status-settings');
    if (b) b.innerHTML = `<span class="sync-dot ${ss.cls}"></span> ${ss.text}`;
  },

  // ========== WORKOUT ==========

  getRestSeconds() {
    const w = this.currentWorkout;
    if (!w) return 120;
    const ep = EXECUTION_PROFILES[w.theme];
    return ep ? ep.restSec : 120;
  },

  startWorkout(dayNum) {
    const config = Storage.getConfig();
    this.currentWorkout = Workout.generateWorkout(config, dayNum);
    this.renderWorkoutScreen();
    this.showScreen('workout');
    this.persistWorkout();
  },

  renderWorkoutScreen() {
    const w = this.currentWorkout;
    const dd = DAY_DEFS[w.dayNum - 1];
    const titleClass = {cyan:'',green:'green',purple:'purple',amber:'amber'}[dd.color] || '';

    const ep = EXECUTION_PROFILES[w.theme];
    const epHtml = ep ? `
      <div class="exec-profile">
        <span class="exec-badge">${ep.label}</span>
        <span class="exec-desc">${ep.desc}</span>
        <span class="exec-rpe">RPE ${ep.rpe}</span>
        <span class="exec-rest">Rest ${Math.floor(ep.restSec/60)}:${String(ep.restSec%60).padStart(2,'0')}</span>
      </div>` : '';
    document.getElementById('workout-header').innerHTML = `
      <div class="workout-title ${titleClass}">D${w.dayNum} — ${w.dayName}</div>
      <div class="workout-week">Semana ${w.week} — ${w.theme}</div>${epHtml}`;

    const content = document.getElementById('workout-content');
    content.innerHTML = '';

    // 1RM Test special
    if (w.special === '1rm_test') {
      this.render1RMTest(content, w);
      if (w.running) {
        content.insertAdjacentHTML('beforeend', '<div class="workout-divider"><span>CORRIDA</span></div>');
        this.renderRunCard(content, w);
      }
      return;
    }

    // Strength exercises
    if (w.exercises.length > 0) {
      w.exercises.forEach((ex, i) => this.renderExerciseCard(content, ex, i));
    }

    // Divider + Running
    if (w.running && w.exercises.length > 0) {
      content.insertAdjacentHTML('beforeend', '<div class="workout-divider"><span>CORRIDA</span></div>');
    }
    if (w.running) {
      this.renderRunCard(content, w);
    }

    // Accessories
    if (w.accessories) {
      w.accessories.forEach((acc, i) => this.renderAccessoryCard(content, acc, i));
    }

    // Atualizar botão de rest timer
    const restSec = this.getRestSeconds();
    const restMin = Math.floor(restSec / 60);
    const restSecR = restSec % 60;
    const restLabel = restSecR > 0 ? `${restMin}:${String(restSecR).padStart(2,'0')}` : `${restMin} MIN`;
    const restBtn = document.getElementById('btn-rest-timer');
    if (restBtn) restBtn.textContent = `DESCANSO ${restLabel}`;

    // Comentario do treino: restaura valor salvo + persiste ao digitar (vive em w.comment)
    const commentEl = document.getElementById('workout-comment');
    if (commentEl) {
      commentEl.value = w.comment || '';
      commentEl.oninput = () => { this.currentWorkout.comment = commentEl.value; this.persistWorkout(); };
    }
  },

  // Gate B+ (Treino Unificado): readiness ruim => nao oferece super meta. null = sem dado/ok.
  superMetaBlocked() {
    const r = Storage.getReadiness();
    if (!r || !r.metrics) return null; // sem dado de readiness: nao bloqueia
    const m = r.metrics;
    if (m.hrv_status === 'LOW') return 'HRV LOW';
    if (m.sleep_hours != null && m.sleep_hours < 6) return 'sono <6h';
    return null;
  },

  renderExerciseCard(container, ex, index) {
    const sm = ex.actual.superMeta;
    const blockReason = sm ? this.superMetaBlocked() : null;
    if (sm) sm.blocked = !!blockReason;
    const showSuper = sm && !blockReason;
    const bbHtml = Workout.formatBarBreakdown(ex.planned.weight);
    const div = document.createElement('div');
    div.className = 'exercise-card' + (showSuper ? ' has-super-meta' : '');

    // Bloco "Carga real" so quando NAO ha super meta ativa (com super meta, o painel cuida do peso/reps)
    const cargaRealHtml = showSuper ? '' : `
      <div class="exercise-input">
        <label>Carga real:</label>
        <input type="number" class="weight-input ex-weight" data-index="${index}" value="${ex.actual.weight || ex.planned.weight}" step="2.5"> kg
        <span class="bar-toggle-icon" id="icon-input-${index}" style="cursor:pointer;font-size:14px;margin-left:4px;">▼</span>
      </div>
      <div class="bar-breakdown" id="bb-input-${index}">
        <div class="bar-breakdown-inner" id="bb-input-c-${index}">${Workout.formatBarBreakdown(ex.actual.weight || ex.planned.weight)}</div>
      </div>`;

    div.innerHTML = `
      <div class="exercise-header">
        <span class="exercise-name">${ex.name}</span>
        <span class="exercise-type ${ex.type}">${ex.type === 'primary' ? 'FOCO' : 'SECUNDARIO'}</span>
      </div>
      <div class="exercise-scheme bar-toggle" data-breakdown="bb-scheme-${index}">
        ${ex.planned.sets}x${ex.planned.reps} @ ${ex.planned.percentage}% = <strong>${ex.planned.weight}kg</strong>
        <span class="bar-toggle-icon" id="icon-scheme-${index}">▼</span>
      </div>
      <div class="bar-breakdown open" id="bb-scheme-${index}">
        <div class="bar-breakdown-inner">${bbHtml}</div>
      </div>
      ${cargaRealHtml}
      ${showSuper ? this.superMetaHtml(sm, index) : (blockReason ? `<div class="sm-blocked">⚠ Readiness baixo (${blockReason}) — super meta desativada hoje. Registra o treino normal.</div>` : '')}
      <div class="sets-tracker">
        ${Array(ex.planned.sets).fill(0).map((_,i) => {
          const isFocus = showSuper && i === sm.focusSetIndex;
          return `<button class="set-btn${isFocus ? ' focus-set' : ''}" data-exercise="${index}" data-set="${i}">Set ${i+1}${isFocus ? ' ⭐' : ''}</button>`;
        }).join('')}
      </div>
      <div class="sets-count" id="sets-count-${index}">0/${ex.planned.sets} sets</div>`;
    container.appendChild(div);

    // Listeners
    div.querySelector('.bar-toggle').addEventListener('click', () => {
      document.getElementById(`bb-scheme-${index}`).classList.toggle('open');
      document.getElementById(`icon-scheme-${index}`).classList.toggle('open');
    });
    if (!showSuper) {
      const iconInput = div.querySelector(`#icon-input-${index}`);
      iconInput.addEventListener('click', () => {
        document.getElementById(`bb-input-${index}`).classList.toggle('open');
        iconInput.classList.toggle('open');
      });
      div.querySelector('.ex-weight').addEventListener('change', e => {
        const val = parseFloat(e.target.value);
        this.currentWorkout.exercises[index].actual.weight = val;
        document.getElementById(`bb-input-c-${index}`).innerHTML = Workout.formatBarBreakdown(val);
        this.persistWorkout();
      });
    } else {
      this.wireSuperMeta(div, index);
    }
    div.querySelectorAll('.set-btn').forEach(btn => {
      btn.addEventListener('click', e => this.toggleSet(e.target));
    });
  },

  // HTML do painel de super meta (fricçao invertida: valores base pre-preenchidos)
  superMetaHtml(sm, index) {
    const theme = this.currentWorkout.theme;
    const rpeRange = theme === 'Hipertrofia' ? '7-8' : '8-9';
    const est = Workout.estimate1RM(sm.weight, sm.reps);
    const serieLabel = sm.mode === 'carga' ? '1ª série (fresco)' : 'última série (AMRAP)';
    const editBlock = sm.mode === 'carga' ? `
      <div class="sm-row">
        <span class="sm-label">Peso</span>
        <button class="sm-step" data-sm="${index}" data-field="weight" data-delta="-2.5">−</button>
        <input type="number" class="sm-input" id="sm-weight-${index}" data-sm="${index}" data-field="weight" value="${sm.weight}" step="2.5">
        <button class="sm-step" data-sm="${index}" data-field="weight" data-delta="2.5">+2,5</button>
        <button class="sm-step" data-sm="${index}" data-field="weight" data-delta="5">+5</button>
      </div>
      <div class="sm-locked">reps travado: <strong>${sm.reps}</strong></div>` : `
      <div class="sm-row">
        <span class="sm-label">Reps</span>
        <button class="sm-step" data-sm="${index}" data-field="reps" data-delta="-1">−</button>
        <input type="number" class="sm-input" id="sm-reps-${index}" data-sm="${index}" data-field="reps" value="${sm.reps}" step="1">
        <button class="sm-step" data-sm="${index}" data-field="reps" data-delta="1">+1</button>
      </div>
      <div class="sm-locked">peso travado: <strong>${sm.weight} kg</strong></div>`;
    return `
      <div class="super-meta-card" id="sm-card-${index}">
        <div class="sm-header">⭐ SUPER META · ${serieLabel}</div>
        <div class="sm-mode">MODO: ${sm.mode === 'carga' ? '+ CARGA' : '+ REPS'}</div>
        ${editBlock}
        <div class="sm-rpe">
          <span class="sm-label">RPE</span>
          ${[7,8,9].map(r => `<button class="sm-rpe-btn${sm.rpe===r?' active':''}" data-sm="${index}" data-rpe="${r}">${r}</button>`).join('')}
        </div>
        <div class="sm-est" id="sm-est-${index}">1RM estimado: <strong>${est} kg</strong></div>
        <div class="sm-cap">⛔ PARE no RPE ${rpeRange} — não vá à falha</div>
      </div>`;
  },

  // Listeners do painel de super meta + estimativa ao vivo
  wireSuperMeta(div, index) {
    const refreshEst = () => {
      const sm = this.currentWorkout.exercises[index].actual.superMeta;
      const est = Workout.estimate1RM(sm.weight, sm.reps);
      sm.estimated1RM = est;
      const estEl = document.getElementById(`sm-est-${index}`);
      if (estEl) estEl.innerHTML = `1RM estimado: <strong>${est} kg</strong>`;
      this.persistWorkout();
    };
    div.querySelectorAll('.sm-step').forEach(btn => {
      btn.addEventListener('click', () => {
        const sm = this.currentWorkout.exercises[index].actual.superMeta;
        const field = btn.dataset.field;
        let v = (sm[field] || 0) + parseFloat(btn.dataset.delta);
        v = field === 'reps' ? Math.max(1, Math.round(v)) : Math.max(0, Math.round(v * 2) / 2);
        sm[field] = v;
        const input = document.getElementById(`sm-${field}-${index}`);
        if (input) input.value = v;
        refreshEst();
      });
    });
    div.querySelectorAll('.sm-input').forEach(input => {
      input.addEventListener('change', e => {
        const sm = this.currentWorkout.exercises[index].actual.superMeta;
        const field = e.target.dataset.field;
        let v = parseFloat(e.target.value);
        if (isNaN(v)) { e.target.value = sm[field]; return; }
        v = field === 'reps' ? Math.max(1, Math.round(v)) : Math.max(0, v);
        sm[field] = v;
        e.target.value = v;
        refreshEst();
      });
    });
    div.querySelectorAll('.sm-rpe-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const sm = this.currentWorkout.exercises[index].actual.superMeta;
        const r = parseInt(btn.dataset.rpe);
        sm.rpe = (sm.rpe === r) ? null : r; // toggle
        div.querySelectorAll('.sm-rpe-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.rpe) === sm.rpe));
        this.persistWorkout();
      });
    });
  },

  renderRunCard(container, w) {
    const r = w.running;
    const dayDef = DAY_DEFS[w.dayNum - 1];
    const runCtx = dayDef.runCtx || 'solo';
    const zi = ZONE_INFO[r.target.zone];
    const cad = CADENCE_TARGETS[runCtx];
    const div = document.createElement('div');
    div.className = 'running-card';
    div.id = 'running-card';
    const noteHtml = r.note ? `<div class="running-card-note">${r.note}</div>` : '';
    const ctxLabel = runCtx === 'solo' ? 'DIA SOLO' : 'COM MUSCULACAO';
    const ctxColor = runCtx === 'solo' ? 'var(--neon-green)' : 'var(--neon-purple)';
    div.innerHTML = `
      <div class="running-card-header">
        <span class="running-card-title">CORRIDA</span>
        <span class="running-card-zone">${r.target.zone}</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-size:10px;font-family:var(--font-display);letter-spacing:1.5px;color:${ctxColor};font-weight:600;">${ctxLabel}</span>
        ${zi ? `<span style="font-size:11px;color:var(--text-muted);">${zi.fc}</span>` : ''}
      </div>
      <div class="running-card-target">${r.target.min} min</div>
      ${noteHtml}
      ${cad ? `<div style="font-size:11px;color:var(--text-muted);margin-top:4px;margin-bottom:8px;">
        <span style="color:var(--neon-amber);">♫</span> ${cad.label}
        <div style="font-size:10px;margin-top:2px;opacity:0.7;">${cad.tip}</div>
      </div>` : ''}
      <div class="run-timer-area">
        <button class="btn btn-green" id="btn-start-run" style="margin-bottom:12px;">INICIAR CORRIDA</button>
        <div id="run-timer-display" style="display:none;">
          <div class="timer-circle-wrapper">
            <div class="timer-circle run-timer-circle" id="run-timer-circle" style="--progress:0">
              <div class="timer-circle-inner">
                <div class="run-timer-val" id="run-timer-value">0:00</div>
              </div>
            </div>
          </div>
          <button class="btn btn-green" id="btn-complete-run" style="width:auto;padding:14px 32px;">CORRIDA COMPLETA</button>
        </div>
      </div>
      <div class="running-inputs">
        <div class="running-input-group">
          <label>Tempo (min)</label>
          <input type="number" id="run-actual-time" value="${r.actual.duration || ''}">
        </div>
        <div class="running-input-group">
          <label>FC Media</label>
          <input type="number" id="run-actual-hr" value="${r.actual.hr || ''}">
        </div>
        <div class="running-input-group">
          <label>Pace</label>
          <input type="text" id="run-actual-pace" placeholder="5:30" value="${r.actual.pace || ''}">
        </div>
      </div>`;
    container.appendChild(div);

    div.querySelector('#btn-start-run').addEventListener('click', () => this.startRunTimer());
    div.querySelector('#btn-complete-run').addEventListener('click', () => this.completeRun());
    ['run-actual-time','run-actual-hr','run-actual-pace'].forEach(id => {
      const el = div.querySelector('#'+id);
      el.addEventListener('change', () => {
        this.currentWorkout.running.actual.duration = parseFloat(document.getElementById('run-actual-time').value) || null;
        this.currentWorkout.running.actual.hr = parseFloat(document.getElementById('run-actual-hr').value) || null;
        this.currentWorkout.running.actual.pace = document.getElementById('run-actual-pace').value || null;
        this.persistWorkout();
      });
    });
  },

  renderAccessoryCard(container, acc, index) {
    const div = document.createElement('div');
    div.className = 'accessory-card';
    div.innerHTML = `
      <div class="accessory-header">
        <span class="accessory-name">${acc.name}</span>
        <span class="accessory-rpe">RPE ${acc.rpe}</span>
      </div>
      <div class="accessory-meta">
        <span>${acc.sets}x${acc.reps}</span>
        <span>${acc.target}</span>
        <span>${acc.rest}s descanso</span>
      </div>
      <div class="exercise-input">
        <label>Carga:</label>
        <input type="number" class="weight-input acc-weight" data-acc="${index}" value="${acc.actualWeight || ''}" step="1" placeholder="kg"> kg
      </div>
      <div class="sets-tracker">
        ${Array(acc.sets).fill(0).map((_,i) => `<button class="set-btn acc-set" data-acc="${index}" data-set="${i}">Set ${i+1}</button>`).join('')}
      </div>
      <div class="sets-count" id="acc-sets-count-${index}">0/${acc.sets} sets</div>`;
    container.appendChild(div);

    div.querySelector('.acc-weight').addEventListener('change', e => {
      const val = parseFloat(e.target.value);
      this.currentWorkout.accessories[index].actualWeight = val;
      Storage.saveAccWeight(acc.name, val);
      this.persistWorkout();
    });
    div.querySelectorAll('.acc-set').forEach(btn => {
      btn.addEventListener('click', e => this.toggleAccSet(e.target, index));
    });
  },

  render1RMTest(container, w) {
    const config = Storage.getConfig();
    (w.rmTestLifts || []).forEach(lift => {
      const oneRM = config.oneRM[lift];
      const warmup = [
        {pct:0, reps:5, w:20, label:'Barra'},
        {pct:50, reps:3, w:Workout.calcWeight(oneRM,50)},
        {pct:60, reps:2, w:Workout.calcWeight(oneRM,60)},
        {pct:70, reps:1, w:Workout.calcWeight(oneRM,70)},
        {pct:80, reps:1, w:Workout.calcWeight(oneRM,80)},
        {pct:85, reps:1, w:Workout.calcWeight(oneRM,85)},
        {pct:90, reps:1, w:Workout.calcWeight(oneRM,90)}
      ];

      const div = document.createElement('div');
      div.className = 'rm-test-card';
      div.innerHTML = `
        <div class="rm-test-title">1RM TEST — ${LIFT_NAMES[lift]}</div>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">1RM atual: ${oneRM}kg</div>
        <div style="margin-bottom:16px;">
          ${warmup.map((s,i) => `
            <div class="rm-warmup-step">
              <span>${s.label || s.pct+'%'} — ${s.reps}x${s.w}kg</span>
              <button class="set-btn rm-warmup-btn" data-lift="${lift}" data-step="${i}">✓</button>
            </div>`).join('')}
        </div>
        <div style="font-size:12px;font-family:var(--font-display);color:var(--neon-magenta);letter-spacing:1px;margin-bottom:12px;">TENTATIVAS</div>
        <div class="rm-attempt-input">
          <label style="color:var(--text-muted);font-size:13px;">1RM alcancado:</label>
          <input type="number" class="weight-input rm-result" data-lift="${lift}" step="2.5" placeholder="${oneRM}" value="${w.rmResults[lift] || ''}"> kg
        </div>
        <button class="btn btn-primary rm-update-btn" data-lift="${lift}" style="margin-top:8px;">ATUALIZAR 1RM</button>`;
      container.appendChild(div);

      div.querySelectorAll('.rm-warmup-btn').forEach(btn => {
        btn.addEventListener('click', e => e.target.classList.toggle('completed'));
      });
      div.querySelector('.rm-result').addEventListener('change', e => {
        this.currentWorkout.rmResults[lift] = parseFloat(e.target.value) || null;
        this.persistWorkout();
      });
      div.querySelector('.rm-update-btn').addEventListener('click', () => {
        const val = this.currentWorkout.rmResults[lift];
        if (val && val > 0) {
          const config = Storage.getConfig();
          config.oneRM[lift] = val;
          Storage.saveConfig(config);
          alert(`${LIFT_NAMES[lift]} 1RM atualizado para ${val}kg!`);
        }
      });
    });
  },

  // ========== SET TOGGLES ==========

  toggleSet(btn) {
    const exIdx = parseInt(btn.dataset.exercise);
    const setIdx = parseInt(btn.dataset.set);
    const wasCompleted = btn.classList.contains('completed');
    btn.classList.toggle('completed');
    const completed = document.querySelectorAll(`.set-btn[data-exercise="${exIdx}"].completed`);
    const indices = Array.from(completed).map(b => parseInt(b.dataset.set));
    this.currentWorkout.exercises[exIdx].actual.setsCompleted = indices.length;
    this.currentWorkout.exercises[exIdx].actual.completedSetIndices = indices;
    document.getElementById(`sets-count-${exIdx}`).textContent = `${indices.length}/${this.currentWorkout.exercises[exIdx].planned.sets} sets`;
    this.persistWorkout();
  },

  toggleAccSet(btn, accIdx) {
    const wasCompleted = btn.classList.contains('completed');
    btn.classList.toggle('completed');
    const completed = document.querySelectorAll(`.acc-set[data-acc="${accIdx}"].completed`);
    const count = completed.length;
    this.currentWorkout.accessories[accIdx].setsCompleted = count;
    this.currentWorkout.accessories[accIdx].completedSetIndices = Array.from(completed).map(b => parseInt(b.dataset.set));
    document.getElementById(`acc-sets-count-${accIdx}`).textContent = `${count}/${this.currentWorkout.accessories[accIdx].sets} sets`;
    this.persistWorkout();
  },

  // ========== TIMERS ==========

  startTimer(minutes) {
    this.stopTimer();
    this.timerTotalSeconds = minutes * 60;
    this.timerSeconds = this.timerTotalSeconds;
    this.updateTimerDisplay();
    const display = document.getElementById('timer-display');
    display.classList.add('active');
    display.classList.remove('finished');
    const circle = document.getElementById('timer-circle');
    circle.classList.remove('warning');
    circle.style.setProperty('--progress', 1);
    this.timerInterval = setInterval(() => {
      this.timerSeconds--;
      this.updateTimerDisplay();
      if (this.timerSeconds <= 0) this.timerFinished();
    }, 1000);
  },

  updateTimerDisplay() {
    const m = Math.floor(this.timerSeconds / 60);
    const s = this.timerSeconds % 60;
    document.getElementById('timer-value').textContent = `${m}:${s.toString().padStart(2,'0')}`;
    const circle = document.getElementById('timer-circle');
    if (this.timerTotalSeconds > 0) {
      const p = this.timerSeconds / this.timerTotalSeconds;
      circle.style.setProperty('--progress', p);
      circle.classList.toggle('warning', this.timerSeconds <= 10 && this.timerSeconds > 0);
    }
  },

  stopTimer() {
    if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
    const display = document.getElementById('timer-display');
    display.classList.remove('active', 'finished');
    const circle = document.getElementById('timer-circle');
    circle.style.setProperty('--progress', 1);
    circle.classList.remove('warning');
  },

  timerFinished() {
    if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
    if (navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
    const display = document.getElementById('timer-display');
    const circle = document.getElementById('timer-circle');
    circle.style.setProperty('--progress', 0);
    circle.classList.remove('warning');
    display.classList.add('finished');
    setTimeout(() => {
      display.classList.remove('active', 'finished');
      circle.style.setProperty('--progress', 1);
    }, 3000);
  },

  // Run timer (count-up)
  startRunTimer() {
    const w = this.currentWorkout;
    if (!w || !w.running) return;
    this.runTimerTarget = w.running.target.min * 60;
    this.runTimerElapsed = 0;
    const startBtn = document.getElementById('btn-start-run');
    const display = document.getElementById('run-timer-display');
    if (startBtn) startBtn.style.display = 'none';
    if (display) display.style.display = '';
    this.updateRunTimerDisplay();
    this.runTimerInterval = setInterval(() => {
      this.runTimerElapsed++;
      this.updateRunTimerDisplay();
      if (this.runTimerElapsed === this.runTimerTarget) {
        if (navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
        const circle = document.getElementById('run-timer-circle');
        if (circle) circle.classList.add('target-reached');
        setTimeout(() => { if (circle) circle.classList.remove('target-reached'); }, 3000);
      }
    }, 1000);
  },

  updateRunTimerDisplay() {
    const m = Math.floor(this.runTimerElapsed / 60);
    const s = this.runTimerElapsed % 60;
    const el = document.getElementById('run-timer-value');
    if (el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    const circle = document.getElementById('run-timer-circle');
    if (circle && this.runTimerTarget > 0) {
      const p = Math.min(this.runTimerElapsed / this.runTimerTarget, 1);
      circle.style.setProperty('--progress', p);
    }
    if (this.runTimerElapsed >= this.runTimerTarget && document.getElementById('run-timer-value')) {
      document.getElementById('run-timer-value').style.color = 'var(--neon-green)';
    }
  },

  completeRun() {
    if (this.runTimerInterval) { clearInterval(this.runTimerInterval); this.runTimerInterval = null; }
    const durMin = Math.round(this.runTimerElapsed / 60);
    this.currentWorkout.running.actual.completed = true;
    this.currentWorkout.running.actual.duration = durMin;
    const timeInput = document.getElementById('run-actual-time');
    if (timeInput) timeInput.value = durMin;
    this.currentWorkout.running.actual.hr = parseFloat(document.getElementById('run-actual-hr')?.value) || null;
    this.currentWorkout.running.actual.pace = document.getElementById('run-actual-pace')?.value || null;
    this.persistWorkout();
  },

  // ========== RESTORE STATE ==========

  restoreWorkoutState() {
    const w = this.currentWorkout;
    w.exercises.forEach((ex, i) => {
      const input = document.querySelector(`.ex-weight[data-index="${i}"]`);
      if (input && ex.actual.weight) {
        input.value = ex.actual.weight;
        const el = document.getElementById(`bb-input-c-${i}`);
        if (el) el.innerHTML = Workout.formatBarBreakdown(ex.actual.weight);
      }
      if (ex.actual.completedSetIndices && ex.actual.completedSetIndices.length) {
        ex.actual.completedSetIndices.forEach(si => {
          const btn = document.querySelector(`.set-btn[data-exercise="${i}"][data-set="${si}"]`);
          if (btn) btn.classList.add('completed');
        });
        const el = document.getElementById(`sets-count-${i}`);
        if (el) el.textContent = `${ex.actual.setsCompleted}/${ex.planned.sets} sets`;
      }
    });
    if (w.accessories) {
      w.accessories.forEach((acc, i) => {
        const input = document.querySelector(`.acc-weight[data-acc="${i}"]`);
        if (input && acc.actualWeight) input.value = acc.actualWeight;
        if (acc.completedSetIndices && acc.completedSetIndices.length) {
          acc.completedSetIndices.forEach(si => {
            const btn = document.querySelector(`.acc-set[data-acc="${i}"][data-set="${si}"]`);
            if (btn) btn.classList.add('completed');
          });
          const el = document.getElementById(`acc-sets-count-${i}`);
          if (el) el.textContent = `${acc.setsCompleted}/${acc.sets} sets`;
        }
      });
    }
  },

  persistWorkout() { if (this.currentWorkout) Storage.saveInProgress(this.currentWorkout); },

  // ========== FINISH / CANCEL ==========

  finishWorkout() {
    const w = this.currentWorkout;
    document.querySelectorAll('.ex-weight').forEach(input => {
      const i = parseInt(input.dataset.index);
      w.exercises[i].actual.weight = parseFloat(input.value);
    });
    // Exercicio foco com super meta ativa: o peso real vem do painel (nao ha .ex-weight).
    // Se bloqueado (readiness), o peso ja foi capturado via .ex-weight acima.
    w.exercises.forEach(ex => {
      const sm = ex.actual.superMeta;
      if (sm && !sm.blocked) ex.actual.weight = sm.weight;
    });
    if (w.running) {
      w.running.actual.duration = parseFloat(document.getElementById('run-actual-time')?.value) || w.running.actual.duration;
      w.running.actual.hr = parseFloat(document.getElementById('run-actual-hr')?.value) || null;
      w.running.actual.pace = document.getElementById('run-actual-pace')?.value || null;
    }

    w.endTime = new Date().toISOString();
    w.completed = true;
    w.duration = Math.round((new Date(w.endTime) - new Date(w.startTime)) / 60000);

    // Comentario do treino (campo livre; vive no treino, nao na mudanca de 1RM)
    w.comment = (document.getElementById('workout-comment')?.value || '').trim();

    // ===== Recalibragem de 1RM (super meta) =====
    const config = Storage.getConfig();
    const recalibs = [];
    w.exercises.forEach(ex => {
      const sm = ex.actual.superMeta;
      if (!sm || sm.blocked) return;
      const est = Workout.estimate1RM(sm.weight, sm.reps);
      sm.estimated1RM = est;
      const rpe = sm.rpe || Workout.rpeCap(w.theme); // null => assumido = teto do tema
      const entry = Workout.recalibrate(config, ex.lift, est, w.theme, { weight: sm.weight, reps: sm.reps, rpe });
      if (entry) {
        // Compensacao registrada NO TREINO (sm.recalib) p/ o usuario ser ciente do amortecimento ao revisar
        sm.recalib = { from: entry.from, to: entry.to, delta: entry.delta, factor: entry.factor, estimated: est };
        recalibs.push({ entry, name: ex.name, theme: w.theme });
      }
    });
    if (recalibs.length) Storage.saveConfig(config); // persiste oneRM novo + oneRMHistory

    Storage.saveWorkout(w);
    Storage.clearInProgress();
    Storage.checkWeekAdvance();
    Sync.commit().then(() => this.refreshSyncIndicator()); // PUT do estado no jsonbin (fim do treino; falha fica pendente)
    this.currentWorkout = null;
    this.stopTimer();
    if (this.runTimerInterval) { clearInterval(this.runTimerInterval); this.runTimerInterval = null; }
    this.showScreen('home');
    this.updateHomeScreen();
    if (recalibs.length) this.showRecalibModal(recalibs, config);
  },

  // Modal de feedback do aumento de 1RM (unico momento de "celebracao" do app consulta-first).
  // Mostra o aumento + rotulo do fator + permite comentario livre (rastreabilidade).
  showRecalibModal(recalibs, config) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay active';
    overlay.id = 'recalib-modal';
    const fmt = v => String(v).replace('.', ',');
    const rows = recalibs.map(r => {
      const e = r.entry;
      const integral = e.factor >= 1.0;
      const tag = integral
        ? '<span class="rc-tag green">🟢 integral ×1,0</span>'
        : '<span class="rc-tag amber">🟡 amortecido ×0,5</span>';
      const motivo = integral ? 'Força, sweet spot' : `${r.theme}, reps fora do sweet spot`;
      // Compensacao: quanto do ganho bruto (estimado − 1RM atual) foi cortado pelo amortecimento
      const bruto = Math.round((e.trigger.estimated - e.from) * 2) / 2;
      const cortado = Math.round((bruto - e.delta) * 2) / 2;
      const comp = integral ? '' :
        `<div class="rc-comp">estimou ${fmt(e.trigger.estimated)} kg · creditado ${fmt(e.to)} kg (amortecido ${fmt(cortado)} kg)</div>`;
      return `
        <div class="rc-row">
          <div class="rc-trigger">${r.name} · ${e.trigger.reps} reps @ ${fmt(e.trigger.weight)} kg · RPE ${e.trigger.rpe}</div>
          <div class="rc-est">1RM estimado ${fmt(e.trigger.estimated)} → ${tag}</div>
          ${comp}
          <div class="rc-delta">▲ 1RM: ${fmt(e.from)} → <strong>${fmt(e.to)} kg</strong> (+${fmt(e.delta)})</div>
          <div class="rc-motivo">${motivo}</div>
        </div>`;
    }).join('');
    overlay.innerHTML = `
      <div class="modal-card">
        <h3>▲ 1RM RECALIBRADO</h3>
        ${rows}
        <div class="modal-actions">
          <button id="recalib-ok" class="btn btn-primary">Fechar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('recalib-ok').addEventListener('click', () => {
      overlay.remove();
      this.updateHomeScreen(); // reflete oneRM novo no resumo
    });
  },

  // Confirmacao in-app (substitui confirm() nativo, suprimido em PWA standalone). Retorna Promise<bool>.
  confirmModal(message, { okLabel = 'Confirmar', cancelLabel = 'Voltar', danger = false } = {}) {
    return new Promise(resolve => {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay active';
      overlay.innerHTML = `
        <div class="modal-card">
          <h3>CONFIRMAR</h3>
          <p style="font-size:13px;color:var(--text-primary);">${message}</p>
          <div class="modal-actions">
            <button class="btn btn-secondary" data-act="cancel">${cancelLabel}</button>
            <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-act="ok">${okLabel}</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      const done = (v) => { overlay.remove(); resolve(v); };
      overlay.querySelector('[data-act="ok"]').addEventListener('click', () => done(true));
      overlay.querySelector('[data-act="cancel"]').addEventListener('click', () => done(false));
    });
  },

  async cancelWorkout() {
    if (!await this.confirmModal('Cancelar treino? Os dados nao salvos serao perdidos.', { okLabel: 'Cancelar treino', cancelLabel: 'Voltar', danger: true })) return;
    this.currentWorkout = null;
    Storage.clearInProgress();
    this.stopTimer();
    if (this.runTimerInterval) { clearInterval(this.runTimerInterval); this.runTimerInterval = null; }
    this.showScreen('home');
    this.updateHomeScreen();
  },

  // ========== SETTINGS ==========

  showSettings() {
    const config = Storage.getConfig();
    document.getElementById('input-squat').value = config.oneRM.squat;
    document.getElementById('input-bench').value = config.oneRM.bench;
    document.getElementById('input-deadlift').value = config.oneRM.deadlift;
    document.getElementById('input-week').value = config.currentWeek;
    document.getElementById('input-5k-goal').value = config.goal5kPace || '';
    const sss = document.getElementById('sync-status-settings');
    if (sss) { const ss = this.syncStatusInfo(); sss.innerHTML = `<span class="sync-dot ${ss.cls}"></span> ${ss.text}`; }
    this.showScreen('settings');
  },

  saveSettings() {
    const config = Storage.getConfig(); // preserva oneRMHistory e demais campos
    const newRM = {
      squat: parseFloat(document.getElementById('input-squat').value),
      bench: parseFloat(document.getElementById('input-bench').value),
      deadlift: parseFloat(document.getElementById('input-deadlift').value)
    };
    // Edicao manual de 1RM: registra no historico (rastreabilidade; permite descida).
    ['squat','bench','deadlift'].forEach(lift => {
      const v = newRM[lift];
      if (!isNaN(v) && v !== config.oneRM[lift]) {
        Workout.recalibrate(config, lift, v, null, {}, { allowDescent: true, source: 'manual' });
      }
    });
    config.currentWeek = parseInt(document.getElementById('input-week').value);
    config.goal5kPace = document.getElementById('input-5k-goal').value;
    Storage.saveConfig(config);
    Sync.commit().then(() => this.refreshSyncIndicator()); // PUT do estado no jsonbin (config mudou)
    this.showScreen('home');
    this.updateHomeScreen();
  },

  // ========== HISTORY ==========

  showHistory() {
    const workouts = Storage.getWorkouts().sort((a,b) => new Date(b.date) - new Date(a.date));
    const el = document.getElementById('history-list');

    if (!workouts.length) {
      el.innerHTML = '<div class="history-empty">Nenhum treino registrado ainda</div>';
    } else {
      el.innerHTML = workouts.map(w => {
        let details = '';
        if (w.exercises && w.exercises.length) {
          details += w.exercises.map(ex => {
            let line = `${ex.name}: ${ex.actual.setsCompleted||0}x${ex.planned.reps} @ ${ex.actual.weight||ex.planned.weight}kg`;
            const sm = ex.actual.superMeta;
            if (sm && !sm.blocked && sm.estimated1RM) {
              const base = `⭐ ${sm.reps} reps @ ${sm.weight}kg${sm.rpe ? ' RPE'+sm.rpe : ''}`;
              let tail;
              if (sm.recalib) {
                const amort = sm.recalib.factor < 1.0 ? ` (×${String(sm.recalib.factor).replace('.',',')})` : '';
                tail = `→ estimou ${sm.recalib.estimated}, aplicou ${sm.recalib.to}${amort}`;
              } else {
                tail = `→ 1RM~${sm.estimated1RM} (sem ganho)`;
              }
              line += ` <span style="color:var(--neon-amber)">${base} ${tail}</span>`;
            }
            return `<div class="history-card-exercise">${line}</div>`;
          }).join('');
        }
        if (w.running && w.running.actual) {
          const rd = w.running;
          details += `<div class="history-card-exercise" style="color:var(--neon-green)">Corrida: ${rd.actual.duration||'?'}min ${rd.target.zone}${rd.actual.hr ? ' FC:'+rd.actual.hr : ''}</div>`;
        }
        if (w.accessories) {
          const done = w.accessories.filter(a => a.setsCompleted > 0).length;
          details += `<div class="history-card-exercise" style="color:var(--neon-amber)">Acessorios: ${done}/${w.accessories.length} exercicios</div>`;
        }
        if (w.comment) {
          const safe = w.comment.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          details += `<div class="history-card-exercise" style="color:var(--text-muted);font-style:italic">📝 ${safe}</div>`;
        }
        return `
          <div class="history-card type-${w.dayType}">
            <div class="history-card-header">
              <div>
                <div class="history-card-date">${this.formatDate(w.date)}</div>
                <div class="history-card-type">D${w.dayNum} ${w.dayName}</div>
              </div>
              <span class="history-card-week">Sem ${w.week}</span>
            </div>
            <div class="history-card-exercises">${details}</div>
          </div>`;
      }).join('');
    }
    this.showScreen('history');
  },

  changeWeek(delta) {
    const config = Storage.getConfig();
    const nw = Math.max(1, Math.min(24, config.currentWeek + delta));
    Storage.updateWeek(nw);
    this.updateHomeScreen();
  },

  formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'short' });
  }
};

document.addEventListener('DOMContentLoaded', () => App.init());

// Service Worker — PWA offline
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
  </script>

  <!-- PASSPHRASE MODAL -->
  <div id="passphrase-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>CONECTAR GARMIN</h3>
      <p>Cola a passphrase do Worker (gerada quando configurou o Cloudflare). Fica salva so neste dispositivo. Sem ela, o tile de Readiness fica oculto.</p>
      <textarea id="passphrase-input" placeholder="32-char hex..." autocomplete="off" spellcheck="false"></textarea>
      <div class="modal-actions">
        <button id="btn-passphrase-cancel" class="btn btn-secondary">Pular</button>
        <button id="btn-passphrase-save" class="btn btn-primary">Salvar</button>
      </div>
    </div>
  </div>
</body>
